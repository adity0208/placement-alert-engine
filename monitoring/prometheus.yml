global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/rules.yml"

scrape_configs:
  - job_name: "placement-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: "placement-api"
          environment: "production"

  - job_name: "placement-redis"
    static_configs:
      - targets: ["redis:6379"]

