# HPA for the API deployment only.
# Worker is single-replica and must NOT be scaled (SESSION_STRING is stateful).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: placement-api-hpa
  namespace: placement
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placement-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5-minute cooldown before scale-down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

