# ============================================================
# Secret template — DO NOT store real values here.
# Use: kubectl create secret generic placement-secrets \
#        --from-env-file=backend/.env -n placement
# OR: populate via CI/CD pipeline secrets.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: placement-secrets
  namespace: placement
type: Opaque
stringData:
  # Replace all values below with real values before applying.
  # Never commit real credentials to version control.
  MONGODB_URI: "REPLACE_WITH_REAL_VALUE"
  GEMINI_API_KEY: "REPLACE_WITH_REAL_VALUE"
  GROQ_API_KEY: "REPLACE_WITH_REAL_VALUE"
  API_ID: "REPLACE_WITH_REAL_VALUE"
  API_HASH: "REPLACE_WITH_REAL_VALUE"
  # SESSION_STRING is a long-lived Telegram auth token — treat like a password
  SESSION_STRING: "REPLACE_WITH_REAL_VALUE"

