# ─────────────────────────────────────────────────────────────────────────────
# Frontend Deployment + Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-frontend
  namespace: placement
  labels:
    app: placement-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-frontend
  template:
    metadata:
      labels:
        app: placement-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USERNAME/placement-frontend:latest   # Replace before apply
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placement-frontend
  namespace: placement
  labels:
    app: placement-frontend
spec:
  selector:
    app: placement-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

