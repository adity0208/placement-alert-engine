# kind cluster config for local K8s validation
# Usage: kind create cluster --config k8s/kind-config.yaml --name placement
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080        # Access frontend at http://localhost:8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 5000
        hostPort: 5000        # Direct API access during dev
        protocol: TCP
  - role: worker
  - role: worker

